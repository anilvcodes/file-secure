<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — File Secure System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container container-narrow">
    <section class="card">
      <h1>Log In</h1>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="jane@example.com" />

        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Your password" />

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>
      <div id="loginMessage" class="message"></div>
      <p class="small-note">No account yet? <a href="register.html">Create one</a></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
