<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — File Secure System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container container-narrow">
    <section class="card">
      <h1>Create Account</h1>
      <form id="registerForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" required minlength="2" placeholder="Jane Doe" />

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="jane@example.com" />

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />

        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>
      <div id="registerMessage" class="message"></div>
      <p class="small-note">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
